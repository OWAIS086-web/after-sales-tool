<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - LUCID Enterprise AI</title>
    
    <!-- Load theme immediately to prevent flash -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #865df5;
            --primary-dark: #7c3aed;
            --accent-color: #a31010;
            --royal-red: #a31010;
            --bg-primary: #1a1a1a;
            --bg-secondary: #242424;
            --bg-tertiary: #2d2d2d;
            --card-bg: #242424;
            --text-primary: #ffffff;
            --text-secondary: #b8b8b8;
            --border-color: #3a3a3a;
            --shadow-lg: 0 10px 25px rgba(0, 0, 0, 0.3);
            --radius-lg: 12px;
            --spacing-lg: 24px;
        }

        [data-theme="light"] {
            --bg-primary: #ffffff;
            --bg-secondary: #f8fafc;
            --bg-tertiary: #f1f5f9;
            --card-bg: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --shadow-lg: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated Background */
        .animated-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        /* Interactive Dots Canvas */
        #dotsCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* Navigation */
        .nav {
            padding: var(--spacing-lg);
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            box-shadow: var(--shadow-lg);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            width: 40px;
            height: 40px;
        }

        .brand-text {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .nav-actions {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .login-btn {
            background: linear-gradient(135deg, var(--royal-red) 0%, #8f0d0d 100%);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(163, 16, 16, 0.3);
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(163, 16, 16, 0.4);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-lg);
        }

        .welcome-container {
            text-align: center;
            max-width: 600px;
        }

        .welcome-title {
            font-size: 56px;
            font-weight: 900;
            margin-bottom: 40px;
            color: var(--text-primary);
        }

        [data-theme="light"] .welcome-title {
            color: var(--royal-red);
        }

        .cta-buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .cta-btn {
            padding: 16px 32px;
            border-radius: var(--radius-lg);
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .cta-btn.primary {
            background: linear-gradient(135deg, var(--royal-red) 0%, #8f0d0d 100%);
            color: white;
            box-shadow: 0 6px 20px rgba(163, 16, 16, 0.3);
        }

        .cta-btn.primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(163, 16, 16, 0.4);
        }

        .cta-btn.secondary {
            background: var(--card-bg);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .cta-btn.secondary:hover {
            background: var(--bg-tertiary);
            transform: translateY(-2px);
        }

        /* Footer */
        .footer {
            padding: var(--spacing-lg);
            background: var(--card-bg);
            border-top: 1px solid var(--border-color);
            text-align: center;
        }

        .footer-text {
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .nav-container {
                flex-direction: column;
                gap: 16px;
            }

            .welcome-title {
                font-size: 42px;
            }

            .cta-buttons {
                flex-direction: column;
                align-items: center;
            }

            .cta-btn {
                width: 100%;
                max-width: 300px;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <!-- Animated Background -->
    <div class="animated-background">
        <canvas id="dotsCanvas"></canvas>
    </div>

    <!-- Navigation -->
    <nav class="nav">
        <div class="nav-container">
            <div class="nav-brand">
                <img src="{{ url_for('static', filename='images/light-logo.svg') }}" alt="LUCID Enterprise AI" class="brand-logo" id="navLogo">
                <script>
                    (function() {
                        const theme = localStorage.getItem('theme') || 'dark';
                        const logo = document.getElementById('navLogo');
                        if (logo) {
                            logo.src = theme === 'dark' ? '/static/images/light-logo.svg' : '/static/images/dark-logo.svg';
                        }
                    })();
                </script>
                <span class="brand-text">LUCID Enterprise AI</span>
            </div>
            
            <div class="nav-actions">
                <a href="{{ url_for('login') }}" class="login-btn">Login</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <div class="welcome-container">
            <h1 class="welcome-title">Welcome to LUCID Enterprise AI</h1>
            
            <div class="cta-buttons">
                <a href="{{ url_for('login') }}" class="cta-btn primary">
                    <span>Get Started</span>
                </a>
                <a href="{{ url_for('register') }}" class="cta-btn secondary">
                    <span>Create Account</span>
                </a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p class="footer-text">© 2026 LUCID Enterprise AI. Release 3.1.1. Advanced Analytics & Business Intelligence Platform.</p>
    </footer>

    <script>
        // Theme management - load saved theme only
        function loadTheme() {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
            updateLogo(savedTheme);
        }

        function updateLogo(theme) {
            const logo = document.getElementById('navLogo');
            if (logo) {
                const logoFile = theme === 'dark' ? 'light-logo.svg' : 'dark-logo.svg';
                logo.src = `/static/images/${logoFile}`;
            }
        }

        // Interactive Dots Animation
        class InteractiveDots {
            constructor() {
                this.canvas = document.getElementById('dotsCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.dots = [];
                this.mouse = { x: 0, y: 0 };
                this.maxDistance = 120;
                this.dotCount = 100;
                
                this.init();
                this.animate();
                this.bindEvents();
            }

            init() {
                this.resize();
                this.createDots();
            }

            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }

            createDots() {
                this.dots = [];
                for (let i = 0; i < this.dotCount; i++) {
                    this.dots.push({
                        x: Math.random() * this.canvas.width,
                        y: Math.random() * this.canvas.height,
                        vx: (Math.random() - 0.5) * 1.5,
                        vy: (Math.random() - 0.5) * 1.5,
                        radius: Math.random() * 2.5 + 1.5,
                        baseVx: (Math.random() - 0.5) * 0.8,
                        baseVy: (Math.random() - 0.5) * 0.8
                    });
                }
            }

            bindEvents() {
                window.addEventListener('resize', () => this.resize());
                
                document.addEventListener('mousemove', (e) => {
                    this.mouse.x = e.clientX;
                    this.mouse.y = e.clientY;
                });

                document.addEventListener('mouseleave', () => {
                    this.mouse.x = -1000;
                    this.mouse.y = -1000;
                });
            }

            drawDot(dot) {
                const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
                const dotColor = isDark ? 'rgba(255, 255, 255, 0.6)' : 'rgba(163, 16, 16, 0.6)';
                
                this.ctx.beginPath();
                this.ctx.arc(dot.x, dot.y, dot.radius, 0, Math.PI * 2);
                this.ctx.fillStyle = dotColor;
                this.ctx.fill();
            }

            drawLine(dot1, dot2, distance) {
                const opacity = 1 - (distance / this.maxDistance);
                const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
                const lineColor = isDark ? `rgba(255, 255, 255, ${opacity * 0.3})` : `rgba(163, 16, 16, ${opacity * 0.3})`;
                
                this.ctx.beginPath();
                this.ctx.moveTo(dot1.x, dot1.y);
                this.ctx.lineTo(dot2.x, dot2.y);
                this.ctx.strokeStyle = lineColor;
                this.ctx.lineWidth = 1;
                this.ctx.stroke();
            }

            getDistance(dot1, dot2) {
                const dx = dot1.x - dot2.x;
                const dy = dot1.y - dot2.y;
                return Math.sqrt(dx * dx + dy * dy);
            }

            updateDots() {
                this.dots.forEach(dot => {
                    dot.vx += dot.baseVx * 0.02;
                    dot.vy += dot.baseVy * 0.02;
                    
                    dot.x += dot.vx;
                    dot.y += dot.vy;

                    if (dot.x < 0 || dot.x > this.canvas.width) {
                        dot.vx *= -0.8;
                        dot.baseVx = (Math.random() - 0.5) * 0.8;
                    }
                    if (dot.y < 0 || dot.y > this.canvas.height) {
                        dot.vy *= -0.8;
                        dot.baseVy = (Math.random() - 0.5) * 0.8;
                    }

                    dot.x = Math.max(0, Math.min(this.canvas.width, dot.x));
                    dot.y = Math.max(0, Math.min(this.canvas.height, dot.y));

                    const mouseDistance = this.getDistance(dot, this.mouse);
                    if (mouseDistance < this.maxDistance && mouseDistance > 0) {
                        const force = (this.maxDistance - mouseDistance) / this.maxDistance;
                        const angle = Math.atan2(this.mouse.y - dot.y, this.mouse.x - dot.x);
                        dot.vx += Math.cos(angle) * force * 0.05;
                        dot.vy += Math.sin(angle) * force * 0.05;
                    }

                    dot.vx *= 0.98;
                    dot.vy *= 0.98;
                    
                    dot.vx += (Math.random() - 0.5) * 0.01;
                    dot.vy += (Math.random() - 0.5) * 0.01;
                    
                    const maxSpeed = 3;
                    const speed = Math.sqrt(dot.vx * dot.vx + dot.vy * dot.vy);
                    if (speed > maxSpeed) {
                        dot.vx = (dot.vx / speed) * maxSpeed;
                        dot.vy = (dot.vy / speed) * maxSpeed;
                    }
                });
            }

            draw() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

                for (let i = 0; i < this.dots.length; i++) {
                    for (let j = i + 1; j < this.dots.length; j++) {
                        const distance = this.getDistance(this.dots[i], this.dots[j]);
                        if (distance < this.maxDistance) {
                            this.drawLine(this.dots[i], this.dots[j], distance);
                        }
                    }

                    const mouseDistance = this.getDistance(this.dots[i], this.mouse);
                    if (mouseDistance < this.maxDistance) {
                        this.drawLine(this.dots[i], this.mouse, mouseDistance);
                    }
                }

                this.dots.forEach(dot => this.drawDot(dot));
            }

            animate() {
                this.updateDots();
                this.draw();
                requestAnimationFrame(() => this.animate());
            }
        }

        // Initialize everything on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadTheme();
            new InteractiveDots();
        });
    </script>
</body>
</html>
