<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Error - LUCID Enterprise AI</title>
    
    <!-- Load theme immediately to prevent flash -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>
    <!-- Animated Background -->
    <div class="animated-background">
        <canvas id="dotsCanvas"></canvas>
    </div>

    <div class="auth-container">
        <!-- Navigation -->
        <nav class="auth-nav">
            <div class="nav-container">
                <div class="nav-brand">
                    <img src="{{ url_for('static', filename='images/light-logo.svg') }}" alt="Insights AI" class="brand-logo" id="authLogo">
                    <span class="brand-text">Insights AI</span>
                </div>
                <div class="nav-actions">
                    <a href="{{ url_for('index') }}" class="nav-link">← Back to Home</a>
                </div>
            </div>
        </nav>

        <div class="auth-content">
            <!-- Error Container -->
            <div class="auth-form-container">
                <div class="error-container">
                    <div class="error-header">
                        <div class="error-icon">⚠️</div>
                        <h1 class="error-title">{{ error_code }}</h1>
                        <p class="error-subtitle">{{ error_message }}</p>
                    </div>

                    <div class="error-description">
                        <p>{{ error_description }}</p>
                    </div>

                    <div class="error-actions">
                        <a href="{{ url_for('index') }}" class="auth-btn">
                            <span class="btn-text">← Back to Home</span>
                            <div class="btn-ripple"></div>
                        </a>
                        {% if current_user.is_authenticated %}
                            <a href="{{ url_for('chatbot_advanced') }}" class="auth-btn secondary">
                                <span class="btn-text">Go to Dashboard</span>
                                <div class="btn-ripple"></div>
                            </a>
                        {% else %}
                            <a href="{{ url_for('login') }}" class="auth-btn secondary">
                                <span class="btn-text">Sign In</span>
                                <div class="btn-ripple"></div>
                            </a>
                        {% endif %}
                    </div>

                    <div class="error-footer">
                        <p>Need help? <a href="mailto:support@insightsai.com" class="auth-link">Contact Support</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Theme management - Load immediately
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
        
        // Theme management
        function loadTheme() {
            try {
                const savedTheme = localStorage.getItem('theme') || 'dark';
                document.documentElement.setAttribute('data-theme', savedTheme);
                updateLogo(savedTheme);
            } catch (error) {
                console.warn('Theme loading error:', error);
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        }

        function toggleTheme() {
            try {
                const html = document.documentElement;
                const currentTheme = html.getAttribute('data-theme');
                const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                html.setAttribute('data-theme', newTheme);
                localStorage.setItem('theme', newTheme);
                updateLogo(newTheme);
            } catch (error) {
                console.warn('Theme toggle error:', error);
            }
        }

        function updateLogo(theme) {
            try {
                const logo = document.getElementById('authLogo');
                const logoFile = theme === 'dark' ? 'light-logo.svg' : 'dark-logo.svg';
                if (logo) {
                    logo.src = `/static/images/${logoFile}`;
                }
            } catch (error) {
                console.warn('Logo update error:', error);
            }
        }

        // Button ripple effect
        function initButtonRipple() {
            const buttons = document.querySelectorAll('.auth-btn');
            
            buttons.forEach(button => {
                button.addEventListener('click', function(e) {
                    const ripple = this.querySelector('.btn-ripple');
                    const rect = this.getBoundingClientRect();
                    const size = Math.max(rect.width, rect.height);
                    const x = e.clientX - rect.left - size / 2;
                    const y = e.clientY - rect.top - size / 2;
                    
                    ripple.style.width = ripple.style.height = size + 'px';
                    ripple.style.left = x + 'px';
                    ripple.style.top = y + 'px';
                    ripple.classList.add('active');
                    
                    setTimeout(() => {
                        ripple.classList.remove('active');
                    }, 600);
                });
            });
        }

        // Interactive Dots Animation
        class InteractiveDots {
            constructor() {
                this.canvas = document.getElementById('dotsCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.dots = [];
                this.mouse = { x: 0, y: 0 };
                this.maxDistance = 120;
                this.dotCount = 100;
                
                this.init();
                this.animate();
                this.bindEvents();
            }

            init() {
                this.resize();
                this.createDots();
            }

            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }

            createDots() {
                this.dots = [];
                for (let i = 0; i < this.dotCount; i++) {
                    this.dots.push({
                        x: Math.random() * this.canvas.width,
                        y: Math.random() * this.canvas.height,
                        vx: (Math.random() - 0.5) * 1.5,
                        vy: (Math.random() - 0.5) * 1.5,
                        radius: Math.random() * 2.5 + 1.5,
                        baseVx: (Math.random() - 0.5) * 0.8,
                        baseVy: (Math.random() - 0.5) * 0.8
                    });
                }
            }

            bindEvents() {
                window.addEventListener('resize', () => this.resize());
                
                document.addEventListener('mousemove', (e) => {
                    this.mouse.x = e.clientX;
                    this.mouse.y = e.clientY;
                });

                document.addEventListener('mouseleave', () => {
                    this.mouse.x = -1000;
                    this.mouse.y = -1000;
                });
            }

            drawDot(dot) {
                const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
                const dotColor = isDark ? 'rgba(255, 255, 255, 0.6)' : 'rgba(163, 16, 16, 0.6)';
                
                this.ctx.beginPath();
                this.ctx.arc(dot.x, dot.y, dot.radius, 0, Math.PI * 2);
                this.ctx.fillStyle = dotColor;
                this.ctx.fill();
            }

            drawLine(dot1, dot2, distance) {
                const opacity = 1 - (distance / this.maxDistance);
                const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
                const lineColor = isDark ? `rgba(255, 255, 255, ${opacity * 0.3})` : `rgba(163, 16, 16, ${opacity * 0.3})`;
                
                this.ctx.beginPath();
                this.ctx.moveTo(dot1.x, dot1.y);
                this.ctx.lineTo(dot2.x, dot2.y);
                this.ctx.strokeStyle = lineColor;
                this.ctx.lineWidth = 1;
                this.ctx.stroke();
            }

            getDistance(dot1, dot2) {
                const dx = dot1.x - dot2.x;
                const dy = dot1.y - dot2.y;
                return Math.sqrt(dx * dx + dy * dy);
            }

            updateDots() {
                this.dots.forEach(dot => {
                    dot.vx += dot.baseVx * 0.02;
                    dot.vy += dot.baseVy * 0.02;
                    
                    dot.x += dot.vx;
                    dot.y += dot.vy;

                    if (dot.x < 0 || dot.x > this.canvas.width) {
                        dot.vx *= -0.8;
                        dot.baseVx = (Math.random() - 0.5) * 0.8;
                    }
                    if (dot.y < 0 || dot.y > this.canvas.height) {
                        dot.vy *= -0.8;
                        dot.baseVy = (Math.random() - 0.5) * 0.8;
                    }

                    dot.x = Math.max(0, Math.min(this.canvas.width, dot.x));
                    dot.y = Math.max(0, Math.min(this.canvas.height, dot.y));

                    const mouseDistance = this.getDistance(dot, this.mouse);
                    if (mouseDistance < this.maxDistance && mouseDistance > 0) {
                        const force = (this.maxDistance - mouseDistance) / this.maxDistance;
                        const angle = Math.atan2(this.mouse.y - dot.y, this.mouse.x - dot.x);
                        dot.vx += Math.cos(angle) * force * 0.05;
                        dot.vy += Math.sin(angle) * force * 0.05;
                    }

                    dot.vx *= 0.98;
                    dot.vy *= 0.98;
                    
                    dot.vx += (Math.random() - 0.5) * 0.01;
                    dot.vy += (Math.random() - 0.5) * 0.01;
                    
                    const maxSpeed = 3;
                    const speed = Math.sqrt(dot.vx * dot.vx + dot.vy * dot.vy);
                    if (speed > maxSpeed) {
                        dot.vx = (dot.vx / speed) * maxSpeed;
                        dot.vy = (dot.vy / speed) * maxSpeed;
                    }
                });
            }

            draw() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

                for (let i = 0; i < this.dots.length; i++) {
                    for (let j = i + 1; j < this.dots.length; j++) {
                        const distance = this.getDistance(this.dots[i], this.dots[j]);
                        if (distance < this.maxDistance) {
                            this.drawLine(this.dots[i], this.dots[j], distance);
                        }
                    }

                    const mouseDistance = this.getDistance(this.dots[i], this.mouse);
                    if (mouseDistance < this.maxDistance) {
                        this.drawLine(this.dots[i], this.mouse, mouseDistance);
                    }
                }

                this.dots.forEach(dot => this.drawDot(dot));
            }

            animate() {
                this.updateDots();
                this.draw();
                requestAnimationFrame(() => this.animate());
            }
        }

        // Initialize everything
        window.addEventListener('load', () => {
            loadTheme();
            initButtonRipple();
            new InteractiveDots();
        });
    </script>

    <style>
        /* Error Page Specific Styles */
        .error-container {
            text-align: center;
        }

        .error-header {
            margin-bottom: 2rem;
        }

        .error-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            display: block;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        .error-title {
            font-size: 3rem;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .error-subtitle {
            font-size: 1.25rem;
            color: var(--text-secondary);
            margin: 0;
        }

        .error-description {
            margin: 2rem 0;
            padding: 1.5rem;
            background: var(--bg-tertiary);
            border-radius: 8px;
            border-left: 4px solid var(--primary-color);
        }

        .error-description p {
            color: var(--text-secondary);
            margin: 0;
            line-height: 1.6;
        }

        .error-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin: 2rem 0;
            flex-wrap: wrap;
        }

        .auth-btn.secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .auth-btn.secondary:hover {
            background: var(--border-color);
            box-shadow: none;
        }

        .error-footer {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border-color);
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .error-footer a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
        }

        .error-footer a:hover {
            text-decoration: underline;
        }
    </style>
</body>
</html>
